name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v7

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Cloud Run 배포
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: wif-reject-test
          region: us-central1
          source: .
          flags: --no-allow-unauthenticated --service-account=${{ vars.RUNTIME_SA }} --build-service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.BUILD_SA }}
